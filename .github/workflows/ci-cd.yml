
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and build server
        run: bun run build

      - name: Package CLI
        run: bun run package:cli

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mushroomcode-artifacts
          path: |
            out/**
          if-no-files-found: error
